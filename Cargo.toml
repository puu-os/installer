[package]
name = "puu-installer"
version = "1.0.47"
edition = "2024"
rust-version = "1.87"
license = "GPL-2.0-or-later"
description = "Standalone installer for bootc-based OSs"
authors = ["Jarkko Sakkinen <jarkko.sakkinen@opinsys.fi>"]
readme = "README.md"
homepage = "https://gitlab.com/puu-os/installer"
repository = "https://gitlab.com/puu-os/installer"

[dependencies]
anyhow = "1"
argh = "0.1"
crossterm = "0.29"
duct = "1.1"
efivar = "2"
gptman = { version = "3", features = ["nix"] }
iso6709parse = "1"
zeroize = "1.8"
iana-time-zone = "0.1.65"
libc = "0.2"
nix = { version = "0.29", features = [ "mount", "sched", "ioctl", "reboot", "fs", "user", "signal", "process", ] }
openssl = { version = "0.10", features = ["vendored"] }
serde_json = "1"
serde_norway = "0.9"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
uuid = { version = "1", features = ["v4"] }
xattr = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
zbus = "5"
