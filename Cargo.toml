[package]
name = "puu-installer"
version = "0.2.18"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
description = "Standalone installer for bootc-based OSs"
authors = ["Jarkko Sakkinen <jarkko.sakkinen@opinsys.fi>"]
readme = "README.md"
homepage = "https://codeberg.org/puu/puu-installer"
repository = "https://codeberg.org/puu/puu-installer"

[dependencies]
anyhow = "1"
argh = "0.1"
blkid = "1"
crossterm = "0.28"
efivar = "2"
gptman = { version = "3", features = ["nix"] }
hex = "0.4"
libc = "0.2"
nix = { version = "0.29", features = [
    "mount", "ioctl", "reboot", "fs", "user", "signal", "process",
] }
ostree = "0.20"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha-crypt = "0.6"
sha2 = "0.10"
serde_norway = "0.9"
udev = "0.9"
strum = { version = "0.26", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tar = "0.4"
x509-cert = { version = "0.2.5", features = ["builder"] }
cms = { version = "0.2.3", features = ["builder"] }
authenticode = { version = "0.6.0", features = ["object"] }
object = { version = "0.39.1", default-features = false, features = ["read_core", "pe"] }
openssl = "0.10.81"
