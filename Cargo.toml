[package]
name = "puu-installer"
version = "1.0.35"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
description = "Standalone installer for bootc-based OSs"
authors = ["Jarkko Sakkinen <jarkko.sakkinen@opinsys.fi>"]
readme = "README.md"
homepage = "https://codeberg.org/puu/puu-installer"
repository = "https://codeberg.org/puu/puu-installer"

[dependencies]
anyhow = "1"
argh = "0.1"
blkid = "1"
crossterm = "0.29"
duct = "1.1"
efivar = "2"
gptman = { version = "3", features = ["nix"] }
hex = "0.4"
iso6709parse = "1"
zeroize = "1.8"
iana-time-zone = "0.1.65"
libc = "0.2"
nix = { version = "0.29", features = [ "mount", "sched", "ioctl", "reboot", "fs", "user", "signal", "process", ] }
openssl = "0.10"
ostree = "0.20"
serde_json = "1"
serde_norway = "0.9"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.26", features = ["derive"] }
tar = "0.4"
udev = "0.9"
uuid = { version = "1", features = ["v4"] }
iocraft = "0.8.4"
tracing = "0.1"
tracing-subscriber = "0.3"
smol = "2"
